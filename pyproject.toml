[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oneai-hub-fastapi"
version = "0.1.0"
description = "FastAPI AI backend for chat, voice, RAG, agents, and file processing"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
